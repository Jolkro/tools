<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bishop Timer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--surface:#14141f;--surface2:#1e1e2e;--border:#2a2a3e;
  --text:#e8e8f0;--text-dim:#8888a0;--text-muted:#555570;
  --eg:#f59e0b;--eg-bg:#f59e0b18;--eg-glow:#f59e0b40;
  --kd:#3b82f6;--kd-bg:#3b82f618;--kd-glow:#3b82f640;
  --ok:#22c55e;--ok-bg:#22c55e18;--ok-glow:#22c55e40;
  --xp:#a855f7;--xp-bg:#a855f718;
  --danger:#ef4444;
  --radius:16px;
}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.app{max-width:420px;margin:0 auto;padding:16px 16px 120px}

/* Header */
.header{text-align:center;padding:24px 0 16px}
.header h1{font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim)}
.header .level-badge{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:8px 16px;border-radius:99px;background:var(--xp-bg);border:1px solid var(--xp);font-size:.85rem;font-weight:600}
.header .level-badge .emoji{font-size:1.2rem}

/* XP Bar */
.xp-bar-container{margin:16px 0;padding:16px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border)}
.xp-labels{display:flex;justify-content:space-between;margin-bottom:8px;font-size:.75rem;color:var(--text-dim)}
.xp-bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--xp),#c084fc);border-radius:99px;transition:width 1s ease}
.xp-today{text-align:center;margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--xp)}

/* Timer Cards */
.timers{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.timer-card{position:relative;padding:20px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all .2s;overflow:hidden;-webkit-user-select:none;user-select:none}
.timer-card:active{transform:scale(.98)}
.timer-card.active{border-color:var(--card-color)}
.timer-card.active::before{content:'';position:absolute;inset:0;background:var(--card-glow);opacity:.15;pointer-events:none}
.timer-card .top{display:flex;justify-content:space-between;align-items:center}
.timer-card .identity{font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:10px}
.timer-card .identity .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.timer-card .identity .label{font-size:.7rem;font-weight:600;padding:3px 8px;border-radius:6px;letter-spacing:1px;text-transform:uppercase}
.timer-card .timer-display{font-family:'JetBrains Mono',monospace;font-size:2rem;font-weight:800;margin-top:12px;font-variant-numeric:tabular-nums;color:var(--text-muted);transition:color .3s}
.timer-card.active .timer-display{color:var(--text)}
.timer-card .today-total{font-size:.8rem;color:var(--text-dim);margin-top:4px}
.timer-card .btn-row{display:flex;gap:8px;margin-top:12px}
.timer-card .btn{padding:10px 20px;border-radius:10px;border:none;font-weight:700;font-size:.85rem;cursor:pointer;transition:all .15s;font-family:'Outfit',sans-serif}
.timer-card .btn:active{transform:scale(.95)}
.btn-start{background:var(--card-color);color:#000}
.btn-stop{background:var(--danger);color:#fff}

/* EG card */
.timer-card.eg{--card-color:var(--eg);--card-bg:var(--eg-bg);--card-glow:var(--eg-glow)}
.timer-card.eg .dot,.timer-card.eg .label{background:var(--eg)}
.timer-card.eg .label{color:#000}
/* KD card */
.timer-card.kd{--card-color:var(--kd);--card-bg:var(--kd-bg);--card-glow:var(--kd-glow)}
.timer-card.kd .dot,.timer-card.kd .label{background:var(--kd)}
.timer-card.kd .label{color:#fff}
/* OK card */
.timer-card.ok{--card-color:var(--ok);--card-bg:var(--ok-bg);--card-glow:var(--ok-glow)}
.timer-card.ok .dot,.timer-card.ok .label{background:var(--ok)}
.timer-card.ok .label{color:#000}

/* Daily Overview */
.daily{padding:16px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin:16px 0}
.daily h2{font-size:.85rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.daily-bars{display:flex;flex-direction:column;gap:10px}
.daily-bar-row{display:flex;align-items:center;gap:10px}
.daily-bar-label{width:28px;font-family:'JetBrains Mono',monospace;font-size:.75rem;font-weight:700;color:var(--text-dim)}
.daily-bar-track{flex:1;height:24px;background:var(--surface2);border-radius:8px;overflow:hidden;position:relative}
.daily-bar-fill{height:100%;border-radius:8px;transition:width .8s ease}
.daily-bar-fill.eg{background:linear-gradient(90deg,var(--eg),#fbbf24)}
.daily-bar-fill.kd{background:linear-gradient(90deg,var(--kd),#60a5fa)}
.daily-bar-fill.ok{background:linear-gradient(90deg,var(--ok),#4ade80)}
.daily-bar-time{width:55px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:.8rem;font-weight:600}
.daily-bar-goal{position:absolute;right:0;top:0;bottom:0;width:2px;background:var(--text-muted);opacity:.5}
.goal-marker{position:absolute;height:100%;width:2px;background:rgba(255,255,255,.3)}

/* Streak */
.streak{text-align:center;padding:12px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin:16px 0}
.streak .fire{font-size:1.5rem}
.streak .count{font-family:'JetBrains Mono',monospace;font-size:1.2rem;font-weight:800;margin:0 4px}
.streak .text{font-size:.8rem;color:var(--text-dim)}

/* Level up overlay */
.levelup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s}
.levelup-overlay.show{opacity:1;pointer-events:all}
.levelup-content{text-align:center;padding:40px;animation:levelPop .5s ease}
.levelup-content .big-emoji{font-size:4rem;margin-bottom:16px}
.levelup-content h2{font-size:1.5rem;font-weight:800;margin-bottom:8px}
.levelup-content p{color:var(--text-dim);font-size:.9rem;line-height:1.5}
.levelup-content .dismiss{margin-top:24px;padding:12px 32px;border-radius:12px;border:none;background:var(--xp);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;font-family:'Outfit',sans-serif}

/* Notification permission */
.notif-banner{padding:12px 16px;background:var(--surface2);border-radius:var(--radius);border:1px solid var(--border);margin:16px 0;display:flex;align-items:center;gap:12px;font-size:.85rem;cursor:pointer}
.notif-banner .icon{font-size:1.2rem}
.notif-banner:active{opacity:.8}

/* Pulse animation for active timer */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.timer-card.active .dot{animation:pulse 2s ease infinite}
@keyframes levelPop{0%{transform:scale(.5);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

/* History */
.history{padding:16px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin:16px 0}
.history h2{font-size:.85rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.history-item:last-child{border-bottom:none}
.history-item .left{display:flex;align-items:center;gap:8px}
.history-item .dot-sm{width:8px;height:8px;border-radius:50%}
.history-item .time{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--text-dim)}
.history-item .dur{font-family:'JetBrains Mono',monospace;font-size:.85rem;font-weight:600}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ─── CONFIG ─────────────────────────────────────────────────────
const WEBHOOKS = {
};

const IDENTITIES = {
  eg: { name: 'Easygoing', short: 'EG', channel: '#easygoing-agent' },
  kd: { name: 'Kroijer Digital', short: 'KD', channel: '#digital-agent' },
  ok: { name: 'Personal', short: 'OK', channel: '#personal-agent' }
};

const LEVELS = [
  { level: 1, xp: 0, title: 'Rookie', emoji: '🌱' },
  { level: 2, xp: 200, title: 'Apprentice', emoji: '⚡' },
  { level: 3, xp: 500, title: 'Professional', emoji: '💼' },
  { level: 4, xp: 1000, title: 'Expert', emoji: '🎯' },
  { level: 5, xp: 2000, title: 'Master', emoji: '🏆' },
  { level: 6, xp: 3500, title: 'Grandmaster', emoji: '👑' },
  { level: 7, xp: 6000, title: 'Legend', emoji: '🌟' }
];

const DAILY_GOAL_MIN = 60; // 1 hour per identity
const WEEKLY_GOAL_MIN = 300; // 5 hours per identity
const NOTIF_INTERVAL_MIN = 60; // notify every hour

// ─── STATE ──────────────────────────────────────────────────────
const STORAGE_KEY = 'bishop_timer_v1';

function defaultState() {
  return {
    activeTimer: null, // 'eg' | 'kd' | 'ok' | null
    activeStart: null, // ISO timestamp
    sessions: [], // [{id, identity, start, end, duration_min}]
    xp: { total: 0, today: 0, lastDate: null },
    streak: { count: 0, lastDate: null },
    notifPermission: false,
    showLevelUp: false,
    newLevel: null
  };
}

let state = loadState();

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const s = JSON.parse(saved);
      // Reset daily XP if new day
      const today = new Date().toISOString().slice(0, 10);
      if (s.xp.lastDate !== today) {
        s.xp.today = 0;
        s.xp.lastDate = today;
      }
      return s;
    }
  } catch (e) {}
  return defaultState();
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// ─── XP CALCULATIONS ───────────────────────────────────────────
function getLevel(totalXp) {
  let current = LEVELS[0];
  for (const l of LEVELS) {
    if (totalXp >= l.xp) current = l;
    else break;
  }
  return current;
}

function getNextLevel(totalXp) {
  for (const l of LEVELS) {
    if (totalXp < l.xp) return l;
  }
  return null;
}

function getTodaySessions() {
  const today = new Date().toISOString().slice(0, 10);
  return state.sessions.filter(s => s.start.slice(0, 10) === today);
}

function getTodayMinutes(identity) {
  return getTodaySessions()
    .filter(s => s.identity === identity)
    .reduce((sum, s) => sum + (s.duration_min || 0), 0);
}

function getWeekSessions() {
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  monday.setHours(0, 0, 0, 0);
  const mondayStr = monday.toISOString().slice(0, 10);
  return state.sessions.filter(s => s.start.slice(0, 10) >= mondayStr);
}

function getWeekMinutes(identity) {
  return getWeekSessions()
    .filter(s => s.identity === identity)
    .reduce((sum, s) => sum + (s.duration_min || 0), 0);
}

function addXP(amount, reason) {
  const oldLevel = getLevel(state.xp.total);
  state.xp.total += amount;
  state.xp.today += amount;
  state.xp.lastDate = new Date().toISOString().slice(0, 10);
  const newLevel = getLevel(state.xp.total);
  if (newLevel.level > oldLevel.level) {
    state.showLevelUp = true;
    state.newLevel = newLevel;
  }
  saveState();
}

function checkDailyBonuses() {
  const today = new Date().toISOString().slice(0, 10);
  const egMin = getTodayMinutes('eg');
  const kdMin = getTodayMinutes('kd');
  const okMin = getTodayMinutes('ok');

  // Check if all 3 touched (30+ min each)
  const allTouched = egMin >= 30 && kdMin >= 30 && okMin >= 30;
  // Check if daily goal met (1h each)
  const goalMet = egMin >= DAILY_GOAL_MIN && kdMin >= DAILY_GOAL_MIN && okMin >= DAILY_GOAL_MIN;

  // Use session metadata to avoid double-awarding
  const bonusKey = `bonus_${today}`;
  const awarded = JSON.parse(localStorage.getItem(bonusKey) || '{}');

  if (allTouched && !awarded.allTouched) {
    addXP(25, 'Alle 3 identiteter berørt');
    awarded.allTouched = true;
  }
  if (goalMet && !awarded.goalMet) {
    addXP(50, 'Dagligt mål nået');
    awarded.goalMet = true;
    // Check streak
    updateStreak();
  }
  localStorage.setItem(bonusKey, JSON.stringify(awarded));
}

function updateStreak() {
  const today = new Date().toISOString().slice(0, 10);
  if (state.streak.lastDate === today) return;

  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  // Skip weekends
  while (yesterday.getDay() === 0 || yesterday.getDay() === 6) {
    yesterday.setDate(yesterday.getDate() - 1);
  }
  const yesterdayStr = yesterday.toISOString().slice(0, 10);

  if (state.streak.lastDate === yesterdayStr || state.streak.count === 0) {
    state.streak.count++;
    state.streak.lastDate = today;
    // Streak bonuses
    if (state.streak.count === 5) addXP(100, '5-dags streak!');
    if (state.streak.count === 10) addXP(250, '10-dags streak!');
  } else {
    state.streak.count = 1;
    state.streak.lastDate = today;
  }
  saveState();
}

// ─── TIMER ACTIONS ──────────────────────────────────────────────
function startTimer(identity) {
  // Stop current if different
  if (state.activeTimer && state.activeTimer !== identity) {
    stopTimer(false);
  }
  if (state.activeTimer === identity) {
    stopTimer(true);
    return;
  }

  state.activeTimer = identity;
  state.activeStart = new Date().toISOString();
  saveState();

  // Send to Slack
  const info = IDENTITIES[identity];
  const time = new Date().toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' });
  sendSlack(identity, `🟢 ${info.short} session startet kl. ${time}`);

  // Schedule notification
  scheduleNotification(identity);

  render();
}

function stopTimer(sendSlack_flag = true) {
  if (!state.activeTimer) return;

  const identity = state.activeTimer;
  const start = new Date(state.activeStart);
  const end = new Date();
  const durationMin = Math.round((end - start) / 60000);

  // Save session
  state.sessions.push({
    id: Date.now(),
    identity,
    start: state.activeStart,
    end: end.toISOString(),
    duration_min: durationMin
  });

  // Award XP (10 per hour)
  const xpEarned = Math.floor(durationMin / 6); // 10 per 60 min = 1 per 6 min
  if (xpEarned > 0) addXP(xpEarned, `${durationMin} min ${IDENTITIES[identity].short}`);

  // Send to Slack
  if (sendSlack_flag) {
    const info = IDENTITIES[identity];
    sendSlack(identity, `🔴 ${info.short} session slut — ${durationMin} min`);
  }

  state.activeTimer = null;
  state.activeStart = null;
  saveState();

  // Check bonuses
  checkDailyBonuses();

  render();
}

function sendSlack(identity, text) {
  const webhook = WEBHOOKS[identity];
  if (!webhook) return;
  fetch(webhook, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  }).catch(err => console.error('Slack error:', err));
}

// ─── NOTIFICATIONS ──────────────────────────────────────────────
function requestNotifPermission() {
  if ('Notification' in window) {
    Notification.requestPermission().then(perm => {
      state.notifPermission = perm === 'granted';
      saveState();
      render();
    });
  }
}

function scheduleNotification(identity) {
  if (!state.notifPermission) return;
  const info = IDENTITIES[identity];
  setTimeout(() => {
    if (state.activeTimer === identity) {
      new Notification(`⏰ ${info.short}: 1 time nået!`, {
        body: 'Fortsæt eller stop sessionen.',
        icon: '⏱️'
      });
      // Reschedule for next hour
      scheduleNotification(identity);
    }
  }, NOTIF_INTERVAL_MIN * 60 * 1000);
}

// ─── RENDER ─────────────────────────────────────────────────────
function getElapsedStr(startISO) {
  const elapsed = Math.floor((Date.now() - new Date(startISO).getTime()) / 1000);
  const h = Math.floor(elapsed / 3600);
  const m = Math.floor((elapsed % 3600) / 60);
  const s = elapsed % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function formatMin(min) {
  if (min < 60) return `${min}m`;
  const h = Math.floor(min / 60);
  const m = min % 60;
  return m > 0 ? `${h}t ${m}m` : `${h}t`;
}

function render() {
  const level = getLevel(state.xp.total);
  const nextLevel = getNextLevel(state.xp.total);
  const xpInLevel = nextLevel ? state.xp.total - level.xp : 0;
  const xpNeeded = nextLevel ? nextLevel.xp - level.xp : 1;
  const xpPct = Math.min(100, (xpInLevel / xpNeeded) * 100);

  const todaySessions = getTodaySessions().sort((a, b) => b.start.localeCompare(a.start)).slice(0, 8);

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="header">
      <h1>⏱ Bishop Timer</h1>
      <div class="level-badge">
        <span class="emoji">${level.emoji}</span>
        <span>Lvl ${level.level} — ${level.title}</span>
      </div>
    </div>

    <div class="xp-bar-container">
      <div class="xp-labels">
        <span>${level.emoji} ${level.title}</span>
        <span>${nextLevel ? `${nextLevel.emoji} ${nextLevel.title}` : 'MAX'}</span>
      </div>
      <div class="xp-bar">
        <div class="xp-fill" style="width:${xpPct}%"></div>
      </div>
      <div class="xp-today">+${state.xp.today} XP i dag · ${state.xp.total} total${nextLevel ? ` · ${nextLevel.xp - state.xp.total} til næste` : ''}</div>
    </div>

    ${state.streak.count > 0 ? `
    <div class="streak">
      <span class="fire">🔥</span>
      <span class="count">${state.streak.count}</span>
      <span class="text">dages streak</span>
    </div>` : ''}

    ${'Notification' in window && !state.notifPermission ? `
    <div class="notif-banner" onclick="requestNotifPermission()">
      <span class="icon">🔔</span>
      <span>Tryk for at aktivere timer-notifikationer</span>
    </div>` : ''}

    <div class="timers">
      ${renderTimerCard('eg')}
      ${renderTimerCard('kd')}
      ${renderTimerCard('ok')}
    </div>

    <div class="daily">
      <h2>Dagens tid</h2>
      <div class="daily-bars">
        ${renderDailyBar('eg')}
        ${renderDailyBar('kd')}
        ${renderDailyBar('ok')}
      </div>
    </div>

    <div class="daily">
      <h2>Ugens tid</h2>
      <div class="daily-bars">
        ${renderWeeklyBar('eg')}
        ${renderWeeklyBar('kd')}
        ${renderWeeklyBar('ok')}
      </div>
    </div>

    ${todaySessions.length > 0 ? `
    <div class="history">
      <h2>Dagens sessioner</h2>
      ${todaySessions.map(s => {
        const startTime = new Date(s.start).toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' });
        const endTime = s.end ? new Date(s.end).toLocaleTimeString('da-DK', { hour: '2-digit', minute: '2-digit' }) : 'aktiv';
        const dotColor = s.identity === 'eg' ? 'var(--eg)' : s.identity === 'kd' ? 'var(--kd)' : 'var(--ok)';
        return `
        <div class="history-item">
          <div class="left">
            <div class="dot-sm" style="background:${dotColor}"></div>
            <span class="time">${startTime}–${endTime}</span>
          </div>
          <span class="dur">${formatMin(s.duration_min || 0)}</span>
        </div>`;
      }).join('')}
    </div>` : ''}

    ${state.showLevelUp ? renderLevelUp() : ''}
  `;
}

function renderTimerCard(id) {
  const info = IDENTITIES[id];
  const isActive = state.activeTimer === id;
  const todayMin = getTodayMinutes(id);
  const activeMin = isActive ? Math.floor((Date.now() - new Date(state.activeStart).getTime()) / 60000) : 0;
  const totalToday = todayMin + activeMin;
  const goalPct = Math.round((totalToday / DAILY_GOAL_MIN) * 100);
  const goalReached = totalToday >= DAILY_GOAL_MIN;

  return `
    <div class="timer-card ${id} ${isActive ? 'active' : ''}" onclick="${isActive ? `stopTimer()` : `startTimer('${id}')`}">
      <div class="top">
        <div class="identity">
          <div class="dot"></div>
          ${info.name}
        </div>
        <div class="label">${info.short}</div>
      </div>
      <div class="timer-display">${isActive ? getElapsedStr(state.activeStart) : '00:00:00'}</div>
      <div class="today-total">
        I dag: ${formatMin(totalToday)} / ${formatMin(DAILY_GOAL_MIN)} ${goalReached ? '✅' : `(${goalPct}%)`}
      </div>
    </div>`;
}

function renderDailyBar(id) {
  const info = IDENTITIES[id];
  const min = getTodayMinutes(id);
  const activeMin = state.activeTimer === id ? Math.floor((Date.now() - new Date(state.activeStart).getTime()) / 60000) : 0;
  const total = min + activeMin;
  const pct = Math.min(100, (total / (DAILY_GOAL_MIN * 2)) * 100);
  const goalPct = (DAILY_GOAL_MIN / (DAILY_GOAL_MIN * 2)) * 100;

  return `
    <div class="daily-bar-row">
      <div class="daily-bar-label">${info.short}</div>
      <div class="daily-bar-track">
        <div class="daily-bar-fill ${id}" style="width:${pct}%"></div>
        <div class="goal-marker" style="left:${goalPct}%"></div>
      </div>
      <div class="daily-bar-time">${formatMin(total)}</div>
    </div>`;
}

function renderWeeklyBar(id) {
  const info = IDENTITIES[id];
  const min = getWeekMinutes(id);
  const pct = Math.min(100, (min / (WEEKLY_GOAL_MIN * 1.5)) * 100);
  const goalPct = (WEEKLY_GOAL_MIN / (WEEKLY_GOAL_MIN * 1.5)) * 100;

  return `
    <div class="daily-bar-row">
      <div class="daily-bar-label">${info.short}</div>
      <div class="daily-bar-track">
        <div class="daily-bar-fill ${id}" style="width:${pct}%"></div>
        <div class="goal-marker" style="left:${goalPct}%"></div>
      </div>
      <div class="daily-bar-time">${formatMin(min)}</div>
    </div>`;
}

function renderLevelUp() {
  const l = state.newLevel;
  return `
    <div class="levelup-overlay show" onclick="dismissLevelUp()">
      <div class="levelup-content">
        <div class="big-emoji">${l.emoji}</div>
        <h2>LEVEL UP!</h2>
        <p>Du er nu niveau ${l.level}<br><strong>${l.title}</strong></p>
        <button class="dismiss" onclick="dismissLevelUp()">Nice! 🎉</button>
      </div>
    </div>`;
}

function dismissLevelUp() {
  state.showLevelUp = false;
  state.newLevel = null;
  saveState();
  render();
}

// ─── TICK ───────────────────────────────────────────────────────
setInterval(() => {
  if (state.activeTimer) render();
}, 1000);

// Initial render
render();
</script>
</body>
</html>
